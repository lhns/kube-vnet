# .github/workflows/release.yaml -- copied verbatim into each operator repo (SPEC.md).
# Only lines marked "# PER-REPO:" differ between repos; SPEC.md has the values.
name: release

# Two modes, one code path:
#   release - a `v*` tag on a commit of main: image tags <TAG_PREFIX>X.Y.Z (and latest, when this is
#             the highest stable release), chart X.Y.Z, GitHub Release.
#   dev     - any other branch push, or run by hand: image tags 0.0.0-dev.g<sha7>, sha-<sha7> and
#             the branch, chart 0.0.0-dev.g<sha7>. No GitHub Release.
# Both build linux/amd64 and linux/arm64, push by digest, check each platform's binary, and only
# then tag and publish the chart. Only release mode signs and attests: nothing verifies dev builds,
# and each signature is a public Rekor entry plus .sig/.att tags on ghcr.
on:
  push:
    tags: ['v*']
    # Not Dependabot's: its runs get a read-only GITHUB_TOKEN and the ghcr push fails with 403.
    branches: ['**', '!dependabot/**']
  workflow_dispatch:

# Cancel superseded dev runs only. A tag release cancelled part-way leaves a version that half exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/lhns
  IMAGE: kube-vnet                 # PER-REPO: image name
  BINARY: /manager                 # PER-REPO: entrypoint binary inside the image
  CHART_NAME: kube-vnet            # PER-REPO: `name` in Chart.yaml
  CHART_PATH: charts/kube-vnet     # PER-REPO: chart directory
  TAG_PREFIX: v                    # PER-REPO: "v" or ""; release image tag and appVersion are <TAG_PREFIX>X.Y.Z
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # A tag cannot publish from a red commit: the release reuses the CI pipeline, not a subset of it.
  # Tags only: a dev run would share ci's cancel-in-progress group with the push-triggered ci run.
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yaml   # PER-REPO: the CI workflow file
    permissions:
      contents: read
  # PER-REPO: further gates go here in the same shape, and into `needs` below.
  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read

  release:
    needs: [ci, e2e]                    # PER-REPO: the gate jobs
    # Skipped gates (dev mode) must not skip this job; failed or cancelled ones still block it.
    # !cancelled(), not always(): always() is never cancelled, so a superseded dev run would keep tagging.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub Release
      packages: write   # images and chart on ghcr.io
      id-token: write   # cosign keyless signing (release mode only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # release mode: all tags (the `latest` decision) and main's history (the ancestry check)
      # PER-REPO: pv-reaper only, its Dockerfile RUNs on the target platform:
      # - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.20.6
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.14.0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1

      - name: Derive mode, versions and tags
        id: v
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            MODE=release
            CHART_VERSION="${GITHUB_REF_NAME#v}"
            APP_VERSION="${TAG_PREFIX}${CHART_VERSION}"
            # A tag cannot release a commit that never landed on main: the gates and the signing
            # identity come from the tagged commit's own workflow files, so an unreviewed branch
            # could otherwise be released by tagging it. This does not stop someone who can edit
            # this workflow; a tag ruleset restricting who can create v* tags does.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; release from a commit of main"
              exit 1
            fi
            # `latest` is what unpinned installs pull: move it only for the highest stable release,
            # so a prerelease or an older patch tagged later does not take it over.
            stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
            EXTRA_TAGS=""
            if [[ "$GITHUB_REF_NAME" =~ $stable ]] \
                && [ "$(git tag -l 'v*' | grep -E "$stable" | sort -V | tail -n1)" = "$GITHUB_REF_NAME" ]; then
              EXTRA_TAGS=latest
            else
              echo "::notice::not moving latest: $GITHUB_REF_NAME is not the highest stable release"
            fi
          else
            MODE=dev
            # The g is required: an all-digit sha with a leading zero (0054012) is an invalid
            # numeric semver identifier and the chart push rejects it. Image tags keep the bare sha.
            CHART_VERSION="0.0.0-dev.g${SHORT}"
            APP_VERSION="$CHART_VERSION"
            EXTRA_TAGS="sha-${SHORT}"
            # The branch tag moves; depend on the sha tag. A branch called latest gets no branch tag.
            BRANCH=$(echo "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9-' '-' | sed 's/-\+/-/g; s/^-//; s/-$//' | cut -c1-128)
            if [ -n "$BRANCH" ] && [ "$BRANCH" != latest ]; then EXTRA_TAGS+=",$BRANCH"; fi
          fi
          {
            echo "mode=$MODE"
            echo "chart_version=$CHART_VERSION"
            echo "app_version=$APP_VERSION"
            echo "extra_tags=$EXTRA_TAGS"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$GITHUB_OUTPUT"

      # By digest, no tag: nothing is tagged until the architecture check passes.
      - name: Build and push ${{ env.IMAGE }} by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.v.outputs.app_version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.v.outputs.date }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}
      # PER-REPO: one more build step per extra image, same shape with its own id, name and
      # build-args (oci-composer: id build-builder, kube-oci-builder, CMD=oci-builder).

      - name: Collect the pushed digests
        id: images
        env:
          MAIN: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          # PER-REPO: one variable per extra image, e.g.
          # BUILDER: ${{ env.REGISTRY }}/kube-oci-builder@${{ steps.build-builder.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo 'refs<<EOF'
            echo "$MAIN"
            # PER-REPO: echo "$BUILDER"
            echo EOF
          } | tee -a "$GITHUB_OUTPUT"

      - name: Verify every platform's binary architecture
        env:
          REFS: ${{ steps.images.outputs.refs }}
        run: |
          set -euo pipefail
          mapfile -t refs <<< "$REFS"
          for ref in "${refs[@]}"; do
            bash scripts/check-binary-arch.sh "$ref" "$BINARY" "$PLATFORMS"
          done

      - name: Tag the verified digests
        env:
          REFS: ${{ steps.images.outputs.refs }}
          APP_VERSION: ${{ steps.v.outputs.app_version }}
          EXTRA_TAGS: ${{ steps.v.outputs.extra_tags }}
        run: |
          set -euo pipefail
          mapfile -t refs <<< "$REFS"
          tags=("$APP_VERSION")
          if [ -n "$EXTRA_TAGS" ]; then IFS=, read -ra extra <<< "$EXTRA_TAGS"; tags+=("${extra[@]}"); fi
          for ref in "${refs[@]}"; do
            name=${ref%@*} digest=${ref#*@}
            for t in "${tags[@]}"; do crane tag "$ref" "$t"; done
            # Signing and the SBOM use the digest, so every tag must resolve to exactly it.
            for t in "${tags[@]}"; do
              got=$(crane digest "$name:$t")
              [ "$got" = "$digest" ] || { echo "::error::$name:$t is $got, want $digest"; exit 1; }
              echo "OK: $name:$t = $digest"
            done
          done

      # syft runs in dev mode too, so the SBOM step stays exercised.
      - name: Image SBOMs; in release mode, sign the images and attest the SBOMs
        env:
          REFS: ${{ steps.images.outputs.refs }}
          MODE: ${{ steps.v.outputs.mode }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t refs <<< "$REFS"
          for ref in "${refs[@]}"; do
            name=${ref%@*}
            sbom="dist/${name##*/}-image.sbom.spdx.json"
            syft "$ref" -o "spdx-json=$sbom"
            if [ "$MODE" = release ]; then
              cosign sign "$ref"
              cosign attest --predicate "$sbom" --type spdx "$ref"
            fi
          done

      # vnet-only: a default install pulls the operator image by digest (F-21). Set in the packaged
      # chart only; the repo's values.yaml keeps `digest: ""`. Runs in dev mode too, to stay exercised.
      - name: Pin the chart's image by digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected image digest: $IMAGE_DIGEST"; exit 1; }
          values="$CHART_PATH/values.yaml"
          # Anchored to the `digest:` line inside the top-level `image:` block.
          sed -i -E '/^image:/,/^[^ #]/ s|^(  digest: )""$|\1"'"$IMAGE_DIGEST"'"|' "$values"
          # Exactly that one line changed.
          [ "$(git diff --numstat -- "$values" | cut -f1,2)" = "$(printf '1\t1')" ] \
            || { echo "::error::pinning the digest did not change exactly one line of $values"; git diff -- "$values"; exit 1; }
          git diff -U0 -- "$values" | grep -qxF "+  digest: \"$IMAGE_DIGEST\"" \
            || { echo "::error::image.digest was not set in $values"; exit 1; }
          git diff -U0 -- "$values" | tail -n 2

      - name: Package and push the chart; in release mode, sign it
        id: chart
        env:
          CHART_VERSION: ${{ steps.v.outputs.chart_version }}
          APP_VERSION: ${{ steps.v.outputs.app_version }}
          MODE: ${{ steps.v.outputs.mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "$CHART_PATH" --version "$CHART_VERSION" --app-version "$APP_VERSION" --destination dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/$CHART_NAME-$CHART_VERSION.tgz" "oci://$REGISTRY/charts"
          digest=$(crane digest "$REGISTRY/charts/$CHART_NAME:$CHART_VERSION")
          echo "digest=$digest" | tee -a "$GITHUB_OUTPUT"
          if [ "$MODE" = release ]; then cosign sign "$REGISTRY/charts/$CHART_NAME@$digest"; fi

      # PER-REPO: steps that put further release assets into dist/ go here (SPEC.md, "Deviations").
      # vnet-only: the kustomize install manifest with this build's image and version labels.
      - name: Render and stamp release.yaml
        env:
          APP_VERSION: ${{ steps.v.outputs.app_version }}
          CHART_VERSION: ${{ steps.v.outputs.chart_version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          kubectl_version=v1.31.0
          # sha256 of the linux/amd64 binary, from dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl.sha256.
          # Update both together; this job holds the signing identity (F-20).
          kubectl_sha256=7c27adc64a84d1c0cc3dcf7bf4b6e916cc00f3f576a2dbac51b318d926032437
          curl -fsSLo kubectl "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          echo "${kubectl_sha256}  kubectl" | sha256sum -c -
          chmod +x kubectl
          # Pin the image this run pushed, by tag and digest; config/manager uses :latest.
          # Stamp the version labels too: config/admission is rendered from
          # the chart at its source version (0.1.0), so its VAPs would
          # otherwise claim helm.sh/chart: kube-vnet-0.1.0 in every release.
          ./kubectl kustomize config/default \
            | sed -e "s|image: ghcr.io/lhns/kube-vnet:latest$|image: ghcr.io/lhns/kube-vnet:${APP_VERSION}@${IMAGE_DIGEST}|" \
                  -e "s|^\( *helm\.sh/chart:\) .*$|\1 kube-vnet-${CHART_VERSION}|" \
                  -e "s|^\( *app\.kubernetes\.io/version:\) .*$|\1 \"${APP_VERSION}\"|" \
            > dist/release.yaml
          # It must deploy this release's image, and no other.
          grep -q "image: ghcr.io/lhns/kube-vnet:${APP_VERSION}@${IMAGE_DIGEST}$" dist/release.yaml \
            || { echo "::error::release.yaml does not deploy kube-vnet:${APP_VERSION}@${IMAGE_DIGEST}"; exit 1; }
          if grep -nE '^ *(- )?image: ' dist/release.yaml | grep -v "image: ghcr.io/lhns/kube-vnet:${APP_VERSION}@${IMAGE_DIGEST}$"; then
            echo "::error::release.yaml deploys an image other than kube-vnet:${APP_VERSION}@${IMAGE_DIGEST}"
            exit 1
          fi
          # Every chart/version label must carry this build's version.
          if grep -nE '^ *(helm\.sh/chart|app\.kubernetes\.io/version):' dist/release.yaml \
              | grep -vE "(helm\.sh/chart: kube-vnet-${CHART_VERSION}|app\.kubernetes\.io/version: \"${APP_VERSION}\")$"; then
            echo "::error::release.yaml carries a chart/version label that was not stamped"
            exit 1
          fi
          echo "stamped $(grep -c -E '^ *(helm\.sh/chart|app\.kubernetes\.io/version):' dist/release.yaml || true) labels"

      # vnet-only: syft sees nothing inside a Helm chart, so scripts/chart-sbom.py builds the SPDX
      # document: the chart plus every image it can deploy, with digests and a link to the image SBOM.
      - name: Chart SBOM, validate; in release mode, attest
        env:
          APP_VERSION: ${{ steps.v.outputs.app_version }}
          CHART_VERSION: ${{ steps.v.outputs.chart_version }}
          MODE: ${{ steps.v.outputs.mode }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          CREATED: ${{ steps.v.outputs.date }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          args=()
          if [[ "$MODE" == release ]]; then
            args+=(--download-location "https://github.com/lhns/kube-vnet/releases/download/${GITHUB_REF_NAME}/kube-vnet-${CHART_VERSION}.tgz")
          fi
          python3 scripts/chart-sbom.py \
            --chart "dist/kube-vnet-${CHART_VERSION}.tgz" \
            --chart-ref "oci://$REGISTRY/charts/kube-vnet" \
            --chart-digest "$CHART_DIGEST" \
            --image-sbom "$REGISTRY/kube-vnet:${APP_VERSION}@${IMAGE_DIGEST}=dist/kube-vnet-image.sbom.spdx.json" \
            --resolve-digests \
            --created "$CREATED" \
            "${args[@]}" \
            -o dist/kube-vnet-chart.sbom.spdx.json
          cat dist/kube-vnet-chart.sbom.spdx.json
          # Hash-pinned, with its dependencies (F-20); the venv's bundled pip downloads nothing itself.
          python3 -m venv "$RUNNER_TEMP/spdx"
          "$RUNNER_TEMP/spdx/bin/pip" install --quiet --require-hashes --no-deps -r .github/requirements/spdx-tools.txt
          "$RUNNER_TEMP/spdx/bin/pyspdxtools" -i dist/kube-vnet-chart.sbom.spdx.json
          # The script leaves out a digest it cannot resolve; ours must be there.
          jq -e --arg d "$IMAGE_DIGEST" '
            .spdxVersion == "SPDX-2.3"
            and (.packages[] | select(.name == "ghcr.io/lhns/kube-vnet")
                 | .checksums[0].checksumValue == ($d | ltrimstr("sha256:")))
            and (.externalDocumentRefs | length == 1)
          ' dist/kube-vnet-chart.sbom.spdx.json
          if [[ "$MODE" == release ]]; then
            cosign attest --predicate dist/kube-vnet-chart.sbom.spdx.json --type spdx \
              "$REGISTRY/charts/kube-vnet@$CHART_DIGEST"
          fi

      - name: Checksums of the release assets
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > "$RUNNER_TEMP/checksums.txt"
          mv "$RUNNER_TEMP/checksums.txt" checksums.txt
          cat checksums.txt

      # Release mode only. A release created by hand first keeps its notes and gets the assets;
      # otherwise the notes are this version's CHANGELOG section, or generated if it has none.
      - name: GitHub Release
        if: steps.v.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.chart_version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          # index(), not a regex: the brackets and dots in "## [1.2.3]" are literal.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { p=1; next }
            p && index($0, "## [") == 1 { exit }
            p { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" dist/*
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; using generated notes"
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi
