name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      # Before the tests: some unit tests render the chart with helm.
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test (unit)
        run: go test ./... -count=1
      - name: verify generated code is up to date
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          # Deepcopy, CRDs, RBAC, the chart's CRD templates, the CRD JSON
          # schemas and the chart-derived kustomize VAPs.
          make generate manifests render-kustomize-vaps
          git diff --exit-code
          # git diff does not see a newly generated (untracked) file, such as
          # the chart template or schema for a new CRD.
          untracked=$(git status --porcelain --untracked-files=all)
          if [ -n "$untracked" ]; then
            echo "generated files not committed:"; echo "$untracked"; exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19
      - name: cache envtest assets
        uses: actions/cache@v6
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-1.31.0
      - name: run integration tests
        run: |
          ASSETS=$($(go env GOPATH)/bin/setup-envtest use 1.31.0 -p path)
          KUBEBUILDER_ASSETS="$ASSETS" go test -tags integration ./internal/... -count=1 -timeout 600s -v

  docker:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/lhns/kube-vnet:ci
      - name: trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/lhns/kube-vnet:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

  trivy-fs:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - name: trivy filesystem scan (sources + go.sum)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'docs,test'

  helm:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Without values the chart refuses to render, and helm lint reports that
      # as INFO and passes without linting anything.
      - name: helm lint
        run: helm lint charts/kube-vnet --strict --set operator.clusterBaseline.ingressIsolationLevel=pod
      - name: helm template + kubeconform (each supported combination)
        run: |
          set -euo pipefail
          # kube-vnet's own CRs are validated against the repo's schemas/.
          render() {
            helm template testrelease charts/kube-vnet --kube-version 1.31.0 "$@" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0 \
                  -schema-location default \
                  -schema-location 'schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  -ignore-missing-schemas
          }
          pod="--set operator.clusterBaseline.ingressIsolationLevel=pod"
          for level in pod namespace cluster; do
            render --set operator.clusterBaseline.ingressIsolationLevel=$level
          done
          # Explicit memberships instead of a preset, plus the optional extras.
          render \
            --set operator.clusterBaseline.memberships.namespace=default-both \
            --set operator.clusterBaseline.memberships.cluster=default-egress \
            --set podMonitor.enabled=true \
            --set metricsService.enabled=true
          # Admission webhook with each certSource, then the network wait.
          render $pod --set webhook.enabled=true
          render $pod --set webhook.enabled=true \
            --set webhook.certSource=cert-manager \
            --set webhook.certManager.issuerRef.name=ci-issuer
          render $pod --set webhook.enabled=true --set webhook.networkWait.enabled=true
          # kube-system enrolled: the CoreDNS carve-out renders.
          render $pod --set-json 'operator.disabledNamespaces=[]'
          # Every optional part off.
          render --set operator.clusterBaseline.create=false \
            --set operator.leaderElect=false --set rbac.aggregate=false --set cleanup.enabled=false
          # Metrics off: no metrics port (kubeconform accepts containerPort 0).
          render $pod --set operator.metricsBindAddress=0
          if helm template testrelease charts/kube-vnet $pod --set operator.metricsBindAddress=0 \
              | grep -q 'containerPort: 0$'; then
            echo "metrics off still renders containerPort: 0"; exit 1
          fi
          # Before Kubernetes 1.30: no ValidatingAdmissionPolicies. The last
          # --kube-version wins.
          render $pod --kube-version 1.29.0
      - name: helm template refuses invalid values
        run: |
          set -uo pipefail
          # Match the chart's own message, so a render that fails for any
          # other reason does not count.
          refuse() {
            local want=$1; shift
            local err
            if err=$(helm template testrelease charts/kube-vnet --kube-version 1.31.0 "$@" 2>&1 >/dev/null); then
              echo "rendered, want a failure: $*"; exit 1
            fi
            if ! grep -qF -- "$want" <<<"$err"; then
              echo "failed without '$want': $*"; echo "$err"; exit 1
            fi
          }
          pod="--set operator.clusterBaseline.ingressIsolationLevel=pod"
          refuse "there is no default"
          refuse "not both" $pod --set operator.clusterBaseline.memberships.namespace=default-both
          refuse "must be one of: pod, namespace, cluster" --set operator.clusterBaseline.ingressIsolationLevel=strict
          refuse "requires webhook.certManager.issuerRef.name" $pod \
            --set webhook.enabled=true --set webhook.certSource=cert-manager
          refuse "webhook.certSource must be one of" $pod \
            --set webhook.enabled=true --set webhook.certSource=vault
          refuse "webhook.networkWait.enabled requires webhook.enabled" $pod \
            --set webhook.networkWait.enabled=true
          refuse "metricsService.enabled requires metrics" $pod \
            --set operator.metricsBindAddress=0 --set metricsService.enabled=true
          refuse "podMonitor.enabled requires metrics" $pod \
            --set operator.metricsBindAddress=0 --set podMonitor.enabled=true
