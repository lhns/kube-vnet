# .github/workflows/ci.yaml -- the shared part, copied verbatim into each operator repo (SPEC.md).
# The repo's own jobs (unit, envtest, chart, e2e lanes) stay alongside these and use the local
# setup-go action. Only lines marked "# PER-REPO:" differ; SPEC.md has the values.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so the release gates on this same pipeline.
  workflow_call:

permissions:
  contents: read

# A LITERAL group name: under workflow_call ${{ github.workflow }} is the caller's, so two called
# workflows would share one group and cancel each other.
concurrency:
  group: ci-${{ github.ref }}  # PER-REPO: a distinct literal per workflow file (ci-, e2e-, ...)
  cancel-in-progress: true

env:
  BINARY: /manager             # PER-REPO: entrypoint binary inside the image
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Go repos only (PER-REPO: absent in pv-reaper).
  go-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The release image is built with the Go that CI tests
        # The local setup-go action installs the Dockerfile's Go, so CI tests what ships. A minor
        # move is a migration: move go.mod and the Dockerfile together.
        run: |
          mod=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]}' go.mod)
          img=$(grep -m1 -oE '^FROM (--platform=[^ ]+ )?golang:[0-9]+[.][0-9]+' Dockerfile | cut -d: -f2)
          if [ -z "$img" ] || [ "$mod" != "$img" ]; then
            echo "go.mod says Go $mod but the Dockerfile builds with golang:${img:-?}"
            exit 1
          fi
          echo "OK: both on Go $mod"
      - name: go.mod's toolchain line names the Dockerfile's Go
        # Minor must match. A patch difference only warns: Dependabot's golang bump edits the
        # Dockerfile alone, and its PR should not go red for that.
        run: |
          tc=$(awk '/^toolchain go/{sub(/^go/, "", $2); print $2}' go.mod)
          img=$(sed -n 's/^FROM .*golang:\([0-9.]*\)@.*/\1/p' Dockerfile)
          [ -n "$tc" ] || { echo "go.mod has no toolchain line"; exit 1; }
          [ -n "$img" ] || { echo "no digest-pinned golang tag found in Dockerfile"; exit 1; }
          if [ "${tc%.*}" != "${img%.*}" ]; then
            echo "go.mod has toolchain go$tc but the Dockerfile builds with golang:$img"
            exit 1
          fi
          [ "$tc" = "$img" ] || echo "::warning::go.mod has toolchain go$tc, the Dockerfile golang:$img; bump the toolchain line"
          echo "OK: toolchain go$tc, golang:$img"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      # Before the tests: some unit tests render the chart with helm.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      # Each build tag compiles a different file set; vet them all.
      - name: go vet
        run: |
          go vet ./...
          for tags in integration e2e e2e_webhook e2e_namespace e2e_experiment; do
            go vet -tags "$tags" ./...
          done
      - name: go build
        run: go build ./...
      - name: go test (unit)
        run: go test ./... -count=1
      - name: verify generated code is up to date
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          # Deepcopy, CRDs, RBAC, the chart's CRD templates, the CRD JSON
          # schemas and the chart-derived kustomize VAPs.
          make generate manifests render-kustomize-vaps
          git diff --exit-code
          # git diff does not see a newly generated (untracked) file, such as
          # the chart template or schema for a new CRD.
          untracked=$(git status --porcelain --untracked-files=all)
          if [ -n "$untracked" ]; then
            echo "generated files not committed:"; echo "$untracked"; exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - name: install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19
      - name: cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-1.31.0
      - name: run integration tests
        run: |
          ASSETS=$($(go env GOPATH)/bin/setup-envtest use 1.31.0 -p path)
          KUBEBUILDER_ASSETS="$ASSETS" go test -tags integration ./internal/... -count=1 -timeout 600s -v

  # Go repos that adopt golangci-lint (PER-REPO, see SPEC.md), with .golangci.yml from SPEC.md.
  lint:
    runs-on: ubuntu-latest
    needs: go-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Built with the installed Go: prebuilt binaries lag Go releases and refuse a newer go.mod.
          install-mode: goinstall
          version: v2.15.0

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (sources, go.sum)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: 'docs'      # PER-REPO: oci-composer 'docs,test'

  # Both platforms, pushed by digest to a throwaway registry and checked with the release's own
  # script, so an arm64 break fails the PR rather than the release.
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:                 # PER-REPO: one entry per image
          - image: kube-vnet
            build-args: ""
    services:
      registry:
        image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PER-REPO: pv-reaper only, its Dockerfile RUNs on the target platform:
      # - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host   # the builder must reach the registry service on localhost
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.20.6
      - name: Build both platforms, push by digest to the local registry
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=localhost:5000/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Verify every platform's binary architecture
        run: bash scripts/check-binary-arch.sh "localhost:5000/${{ matrix.image }}@${{ steps.build.outputs.digest }}" "$BINARY" "$PLATFORMS"
      # PER-REPO: vnet only. The arch check reads the ELF header; this proves the arm64 binary starts.
      - name: Run the arm64 binary under QEMU
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y qemu-user
          crane export --platform linux/arm64 "localhost:5000/${{ matrix.image }}@${{ steps.build.outputs.digest }}" - \
            | tar -xf - -C "$RUNNER_TEMP" "${BINARY#/}"
          qemu-aarch64 "$RUNNER_TEMP/${BINARY#/}" --version
      - name: Build amd64 for the scan (loaded)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ci/${{ matrix.image }}:scan
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci/${{ matrix.image }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

  # The check must be able to fail: an image whose arm64 platform carries an x86-64 binary, the
  # shape of the bug it exists for, must be rejected with exit 1 on arm64 and nothing else.
  arch-check-fails:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.20.6
      - name: Build a mislabelled image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bad"
          cat > "$RUNNER_TEMP/bad/Dockerfile" <<'EOF'
          FROM --platform=linux/amd64 busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec AS amd64
          FROM scratch
          ARG BINARY
          COPY --from=amd64 /bin/busybox ${BINARY}
          EOF
          docker buildx build --platform "$PLATFORMS" --build-arg "BINARY=$BINARY" \
            --output type=image,name=localhost:5000/mislabelled,push-by-digest=true,name-canonical=true,push=true \
            --metadata-file "$RUNNER_TEMP/meta.json" "$RUNNER_TEMP/bad"
          echo "REF=localhost:5000/mislabelled@$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")" >> "$GITHUB_ENV"
      - name: The check rejects it
        run: |
          set +e -uo pipefail
          out=$(bash scripts/check-binary-arch.sh "$REF" "$BINARY" "$PLATFORMS" 2>&1); rc=$?
          echo "$out"
          # Exit 2 (tooling) or a failure on amd64 would prove nothing.
          if [ "$rc" -eq 1 ] \
              && grep -q "^ok   linux/amd64:" <<< "$out" \
              && grep -q "^FAIL linux/arm64: .* has e_machine '3e 00', expected 'b7 00'" <<< "$out"; then
            echo "OK: the check failed, and for the right reason"
          else
            echo "::error::check-binary-arch.sh did not reject an arm64 image holding an x86-64 binary (exit $rc)"
            exit 1
          fi

  helm:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - name: install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Without values the chart refuses to render, and helm lint reports that
      # as INFO and passes without linting anything.
      - name: helm lint
        run: helm lint charts/kube-vnet --strict --set operator.clusterBaseline.ingressIsolationLevel=pod
      - name: helm template + kubeconform (each supported combination)
        run: |
          set -euo pipefail
          # kube-vnet's own CRs are validated against the repo's schemas/.
          render() {
            helm template testrelease charts/kube-vnet --kube-version 1.31.0 "$@" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0 \
                  -schema-location default \
                  -schema-location 'schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  -ignore-missing-schemas
          }
          pod="--set operator.clusterBaseline.ingressIsolationLevel=pod"
          for level in pod namespace cluster; do
            render --set operator.clusterBaseline.ingressIsolationLevel=$level
          done
          # Explicit memberships instead of a preset, plus the optional extras.
          render \
            --set operator.clusterBaseline.memberships.namespace=default-both \
            --set operator.clusterBaseline.memberships.cluster=default-egress \
            --set podMonitor.enabled=true \
            --set metricsService.enabled=true
          # Admission webhook with each certSource, then the network wait.
          render $pod --set webhook.enabled=true
          render $pod --set webhook.enabled=true \
            --set webhook.certSource=cert-manager \
            --set webhook.certManager.issuerRef.name=ci-issuer
          render $pod --set webhook.enabled=true --set webhook.networkWait.enabled=true
          # kube-system enrolled: the CoreDNS carve-out renders.
          render $pod --set-json 'operator.disabledNamespaces=[]'
          # Every optional part off.
          render --set operator.clusterBaseline.create=false \
            --set operator.leaderElect=false --set rbac.aggregate=false --set cleanup.enabled=false
          # Metrics off: no metrics port (kubeconform accepts containerPort 0).
          render $pod --set operator.metricsBindAddress=0
          if helm template testrelease charts/kube-vnet --kube-version 1.31.0 $pod \
              --set operator.metricsBindAddress=0 | grep -q 'containerPort: 0$'; then
            echo "metrics off still renders containerPort: 0"; exit 1
          fi
          # Before Kubernetes 1.30: no ValidatingAdmissionPolicies. The last
          # --kube-version wins.
          render $pod --kube-version 1.29.0
      - name: helm template refuses invalid values
        run: |
          set -uo pipefail
          # Match the chart's own message, so a render that fails for any
          # other reason does not count.
          refuse() {
            local want=$1; shift
            local err
            if err=$(helm template testrelease charts/kube-vnet --kube-version 1.31.0 "$@" 2>&1 >/dev/null); then
              echo "rendered, want a failure: $*"; exit 1
            fi
            if ! grep -qF -- "$want" <<<"$err"; then
              echo "failed without '$want': $*"; echo "$err"; exit 1
            fi
          }
          pod="--set operator.clusterBaseline.ingressIsolationLevel=pod"
          refuse "there is no default"
          refuse "not both" $pod --set operator.clusterBaseline.memberships.namespace=default-both
          refuse "must be one of: pod, namespace, cluster" --set operator.clusterBaseline.ingressIsolationLevel=strict
          refuse "requires webhook.certManager.issuerRef.name" $pod \
            --set webhook.enabled=true --set webhook.certSource=cert-manager
          refuse "webhook.certSource must be one of" $pod \
            --set webhook.enabled=true --set webhook.certSource=vault
          refuse "webhook.networkWait.enabled requires webhook.enabled" $pod \
            --set webhook.networkWait.enabled=true
          refuse "metricsService.enabled requires metrics" $pod \
            --set operator.metricsBindAddress=0 --set metricsService.enabled=true
          refuse "podMonitor.enabled requires metrics" $pod \
            --set operator.metricsBindAddress=0 --set podMonitor.enabled=true
