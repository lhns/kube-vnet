kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# The cluster name comes from `kind create --name` / kind-action.
networking:
  # No kindnet: it does not enforce NetworkPolicy. The e2e setup installs
  # kube-router or Calico instead.
  disableDefaultCNI: true
nodes:
  - role: control-plane
  - role: worker
