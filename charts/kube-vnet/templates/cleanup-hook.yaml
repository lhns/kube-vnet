{{- /*
Pre-delete hook (ADR 0036): a one-shot Job plus minimal RBAC that deletes
every operator-generated NetworkPolicy before Helm tears the release down.
Those policies are created at runtime, not rendered by the chart, so
`helm uninstall` alone would leave the deny-all baselines enforcing with no
controller left to maintain them.

CRDs, CRs and the system vnets are left alone: they carry
`helm.sh/resource-policy: keep` or are runtime-managed, so a later
`helm install` lands cleanly.
*/ -}}
{{- if .Values.cleanup.enabled }}
{{- $image := printf "%s:%s" .Values.cleanup.image.repository .Values.cleanup.image.tag | quote }}
{{- $pullPolicy := .Values.cleanup.image.pullPolicy | default "IfNotPresent" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-vnet.fullname" . }}-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "kube-vnet.cleanupLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-vnet.fullname" . }}-cleanup
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "kube-vnet.cleanupLabels" . | nindent 4 }}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list, delete, deletecollection]
  # stop-operator deletes the operator Deployment (only in the release
  # namespace) so its drift correction can't recreate the policies.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, delete]
  # Used by wait-for-operator-shutdown.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  {{- if .Values.webhook.enabled }}
  # Used by remove-webhooks, before the operator that serves them stops.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    resourceNames: [{{ include "kube-vnet.fullname" . }}-pod-resolution]
    verbs: [get, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-vnet.fullname" . }}-cleanup
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "kube-vnet.cleanupLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-vnet.fullname" . }}-cleanup
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-vnet.fullname" . }}-cleanup
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kube-vnet.fullname" . }}-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "kube-vnet.cleanupLabels" . | nindent 4 }}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        {{- include "kube-vnet.cleanupLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kube-vnet.fullname" . }}-cleanup
      restartPolicy: Never
      # The operator is still running when pre-delete hooks fire, and it
      # would re-apply any policy deleted under it. So: stop the operator
      # (deleting its Deployment), wait for its pods to terminate, then
      # delete the policies. With the webhook on, its configurations go
      # first (remove-webhooks).
      initContainers:
        {{- if .Values.webhook.enabled }}
        {{- /*
        The admission webhook configurations go first: the validating one is
        failurePolicy: Fail, and Helm deletes it only after this hook, so once
        stop-operator runs every pod write in a managed namespace would be
        rejected until the uninstall ends (or for good, if it fails).
        */}}
        - name: remove-webhooks
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: [kubectl]
          args:
            - delete
            - mutatingwebhookconfiguration,validatingwebhookconfiguration
            - {{ include "kube-vnet.fullname" . }}-pod-resolution
            - --ignore-not-found
            - --wait=false
          securityContext:
            {{- include "kube-vnet.cleanupSecurityContext" . | nindent 12 }}
        {{- end }}
        - name: stop-operator
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: [kubectl]
          args:
            - delete
            - deployment
            - {{ include "kube-vnet.fullname" . }}
            - --namespace
            - {{ .Release.Namespace }}
            - --ignore-not-found
            - --wait=true
            - --timeout=60s
          securityContext:
            {{- include "kube-vnet.cleanupSecurityContext" . | nindent 12 }}
        - name: wait-for-operator-shutdown
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: [kubectl]
          # The name label already matches only the operator's pods: the network
          # beacons and this Job's own pod carry names of their own.
          args:
            - wait
            - --for=delete
            - pod
            - --selector
            - app.kubernetes.io/name={{ include "kube-vnet.name" . }},app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=controller
            - --namespace
            - {{ .Release.Namespace }}
            - --timeout=60s
          securityContext:
            {{- include "kube-vnet.cleanupSecurityContext" . | nindent 12 }}
      containers:
        - name: cleanup
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          # The registry.k8s.io/kubectl image is distroless (no shell), so
          # kubectl is invoked directly; its output lists what was deleted.
          command:
            - kubectl
          args:
            - delete
            - networkpolicy
            - --all-namespaces
            - --selector
            - kube-vnet.system/managed-by=kube-vnet
            - --ignore-not-found
            - --wait=true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            {{- include "kube-vnet.cleanupSecurityContext" . | nindent 12 }}
{{- end }}
