apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-vnet.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-vnet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-vnet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-vnet.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kube-vnet.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "kube-vnet.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.operator.leaderElect }}
            - --leader-elect
            {{- end }}
            - --metrics-bind-address={{ .Values.operator.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.operator.healthProbeBindAddress }}
            {{- /* Emit the flag whenever the key is present (a list), even
                   when empty — an empty list must mean "disable nothing",
                   not "fall back to the binary default". Only absent/null
                   (kindIs "invalid") lets the operator's own default apply. */}}
            {{- if not (kindIs "invalid" .Values.operator.disabledNamespaces) }}
            - --disabled-namespaces={{ join "," .Values.operator.disabledNamespaces }}
            {{- end }}
            {{- with .Values.operator.apiserverSourceCIDR }}
            - --apiserver-source-cidr={{ . }}
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - --webhook-enabled
            - --service-account-name={{ include "kube-vnet.serviceAccountName" . }}
            {{- if .Values.webhook.networkWait.enabled }}
            - --network-wait-beacons={{ include "kube-vnet.fullname" . }}-network-beacon.{{ .Release.Namespace }}.svc:9444
            - --network-wait-image={{ include "kube-vnet.image" . }}
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            {{- /* The port is whatever follows the last colon: ":8080" and "0.0.0.0:8080" alike. */}}
            {{- if include "kube-vnet.metricsEnabled" . }}
            - containerPort: {{ regexReplaceAll ".*:" (toString .Values.operator.metricsBindAddress) "" | atoi }}
              name: metrics
            {{- end }}
            - containerPort: {{ regexReplaceAll ".*:" .Values.operator.healthProbeBindAddress "" | atoi }}
              name: health
            {{- if .Values.webhook.enabled }}
            - containerPort: 9443
              name: webhook
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          {{- /*
          readOnlyRootFilesystem is on, so the serving cert has to come from
          a mounted Secret rather than anything written at runtime.
          */}}
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-cert
          secret:
            secretName: {{ include "kube-vnet.fullname" . }}-webhook-cert
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
