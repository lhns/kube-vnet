{{- /*
Validating admission for kube-vnet.system/* labels on operator-managed
resources: Pods (resolution-controller-stamped membership labels) and
NetworkPolicies + VirtualNetworks (operator-owned `managed-by`, `network`,
`role` labels per ADR 0037).

These labels are operator-managed. Users must not set, change, or delete
them. The operator's ServiceAccount is exempted via a username-prefix check
so the operator's own writes go through.

Requires Kubernetes >= 1.30 (where ValidatingAdmissionPolicy is GA). On
older clusters this template renders nothing; the operator's drift
correction will overwrite any user-set value within one reconcile cycle
anyway.

See ADR 0030 (the convention's origin for pod labels) and ADR 0037 (the
generalization to NetworkPolicy and VirtualNetwork labels).
*/}}
{{- if include "kube-vnet.vapSupported" . }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kube-vnet.fullname" . }}-system-labels-protected
  labels:
    {{- include "kube-vnet.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
      - apiGroups:   ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["networkpolicies"]
      - apiGroups:   ["kube-vnet.lhns.de"]
        apiVersions: ["v1alpha1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["virtualnetworks"]
  {{- if .Values.webhook.enabled }}
  {{- /*
  With the admission webhook on, pods it admits are left to the validating
  webhook (ADR 0034). This policy would reject every pod creation there: the
  mutator's stamps are attributed to the requester, not to the operator's
  ServiceAccount, so the username exemption below does not cover them. The
  validating webhook enforces the stronger property instead (stamps must
  equal what resolution produces, which CEL cannot compute).

  Pods the webhooks' selectors exclude (kube-vnet.webhookSelectors) are
  still policed here, so no namespace is left without either check. A pod
  is excluded by its namespace, or by carrying the chart's
  app.kubernetes.io/name label; on UPDATE the webhook is skipped only when
  both the old and the new pod carry it.
  */}}
  {{- $nameKey := quote "app.kubernetes.io/name" }}
  {{- $name := include "kube-vnet.name" . | quote }}
  matchConditions:
    - name: pod-outside-webhook-scope
      expression: |
        request.resource.resource != "pods" ||
        request.namespace in {{ include "kube-vnet.webhookExcludedNamespaces" . }} ||
        (
          {{ $nameKey }} in object.metadata.?labels.orValue({}) &&
          object.metadata.labels[{{ $nameKey }}] == {{ $name }} &&
          (
            oldObject == null ||
            (
              {{ $nameKey }} in oldObject.metadata.?labels.orValue({}) &&
              oldObject.metadata.labels[{{ $nameKey }}] == {{ $name }}
            )
          )
        )
  {{- end }}
  variables:
    # The system-label prefix kube-vnet.system/ is reserved for operator output.
    - name: systemPrefix
      expression: '"kube-vnet.system/"'
    # The operator's ServiceAccount username is exempted from this VAP.
    # Templated from Helm release values so a non-default install lines up.
    - name: operatorUser
      expression: {{ include "kube-vnet.operatorUsername" . | printf "%q" | quote }}
    # System labels in the new object.
    - name: newSystemLabels
      expression: 'object.metadata.?labels.orValue({}).filter(k, k.startsWith(variables.systemPrefix))'
    # System labels in the old object (empty for CREATE).
    - name: oldSystemLabels
      expression: 'oldObject == null ? [] : oldObject.metadata.?labels.orValue({}).filter(k, k.startsWith(variables.systemPrefix))'
  validations:
    # Allow if the requester is the operator's ServiceAccount.
    # Otherwise require that no kube-vnet.system/* labels are added, removed,
    # or changed: the set of (key, value) pairs in oldObject and object must
    # be identical for system-prefixed keys.
    - expression: |
        request.userInfo.username == variables.operatorUser ||
        (
          variables.newSystemLabels.all(k,
            oldObject != null &&
            (k in oldObject.metadata.?labels.orValue({})) &&
            object.metadata.labels[k] == oldObject.metadata.labels[k]
          ) &&
          variables.oldSystemLabels.all(k,
            (k in object.metadata.?labels.orValue({}))
          )
        )
      message: "Labels under kube-vnet.system/ are managed by the kube-vnet operator and cannot be set by users. To declare pod membership in a virtual network, use a label under kube-vnet/ instead (e.g. kube-vnet/net.<vnet>=<direction>)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kube-vnet.fullname" . }}-system-labels-protected
  labels:
    {{- include "kube-vnet.labels" . | nindent 4 }}
spec:
  policyName: {{ include "kube-vnet.fullname" . }}-system-labels-protected
  validationActions: [Deny]
{{- end }}
